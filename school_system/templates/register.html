<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration - School System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <div class="login-box">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="School Logo" class="logo">
        <h2>🏫 Student Registration</h2>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
            <div class="alert">{{ msg }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="password" name="confirm_password" placeholder="Confirm Password" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="text" name="full_name" placeholder="Full Name" required>
            <input type="number" name="age" placeholder="Age" required min="5" max="25">
            <input type="text" name="grade" placeholder="Grade (e.g., Grade 10)" required>
            <button type="submit">Register</button>
        </form>
        <p style="margin-top: 15px; font-size: 14px;">
            Already have an account? <a href="{{ url_for('login') }}" style="color: #1a73e8;">Login</a>
        </p>
    </div>
</body>
</html>
