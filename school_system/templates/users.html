{% extends "base.html" %}
{% block content %}
<h2>Users Management (Admin Only)</h2>

<div class="form-box">
    <h3>Add User</h3>
    <form method="POST" action="{{ url_for('add_user') }}">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <select name="role">
            <option value="admin">Admin</option>
            <option value="teacher">Teacher</option>
            <option value="student">Student</option>
        </select>
        <button type="submit">Add User</button>
    </form>
</div>

<table>
    <thead>
        <tr>
            <th>#</th>
            <th>Username</th>
            <th>Role</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        {% for u in users %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ u.username }}</td>
            <td>{{ u.role }}</td>
            <td>
                {% if u.username != 'Muhsin' %}
                <a href="{{ url_for('delete_user', id=u._id) }}" class="delete" onclick="return confirm('Delete this user?')">Delete</a>
                {% else %}
                <span style="color:gray">Protected</span>
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
